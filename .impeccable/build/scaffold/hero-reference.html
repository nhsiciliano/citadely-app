<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: 02-pulso-de-jornada.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Puritan:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <div class="r-landing-nav region chrome" data-region="landing-nav"><!-- navegación superior blanca con marca Citadely, enlaces y CTA cobalto --></div>
  <div class="r-landing-kicker region text" data-region="landing-kicker"><!-- texto azul Tu central de turnos --><p style="font-size:var(--r-landing-kicker-font);line-height:1.05;margin:0">landing-kicker</p></div>
  <div class="r-landing-headline region text" data-region="landing-headline"><!-- titular oscuro Tomá el control de cada jornada en tres líneas --><p style="font-size:var(--r-landing-headline-font);font-family:var(--r-landing-headline-family),sans-serif;font-weight:var(--r-landing-headline-weight);line-height:1.05;margin:0">landing-headline</p></div>
  <div class="r-landing-description region text" data-region="landing-description"><!-- descripción breve del producto en gris azulado --><p style="font-size:var(--r-landing-description-font);line-height:1.05;margin:0">landing-description</p></div>
  <div class="r-landing-primary-actions region control" data-region="landing-primary-actions"><!-- botón cobalto Crear mi cuenta y enlace Ver cómo funciona: rebuild the control's chrome from the crop (comp-spec.mjs --crop landing-primary-actions); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-landing-proof region text" data-region="landing-proof"><!-- línea factual sobre prueba y cancelación --><p style="line-height:1.05;margin:0">landing-proof</p></div>
  <div class="r-landing-pulse region chrome" data-region="landing-pulse"><!-- línea vertical de la jornada con nodos horarios y cuatro bloques de turnos y estados --></div>
  <div class="r-landing-flow-title region text" data-region="landing-flow-title"><!-- título centrado Así funciona Citadely --><p style="font-size:var(--r-landing-flow-title-font);line-height:1.05;margin:0">landing-flow-title</p></div>
  <div class="r-landing-flow region chrome" data-region="landing-flow"><!-- secuencia horizontal de cuatro pasos conectados con iconos lineales --></div>
  <div class="r-landing-industries region chrome" data-region="landing-industries"><!-- índice compacto de rubros con iconos lineales --></div>
  <div class="r-landing-price region chrome" data-region="landing-price"><!-- bloque de precio vigente con lista y CTA --></div>
  <div class="r-landing-faq region chrome" data-region="landing-faq"><!-- preguntas frecuentes en filas con divisores --></div>
  <div class="r-dashboard-sidebar region chrome" data-region="dashboard-sidebar"><!-- navegación persistente azul noche con marca, módulos y cuenta --></div>
  <div class="r-dashboard-header region chrome" data-region="dashboard-header"><!-- encabezado de jornada con fecha y controles a la derecha --></div>
  <div class="r-dashboard-next-appointment region chrome" data-region="dashboard-next-appointment"><!-- línea temporal azul y próximo turno dominante con hora monoespaciada --></div>
  <div class="r-dashboard-metrics region chrome" data-region="dashboard-metrics"><!-- franja compacta de ocupación, turnos, ingresos y espera --></div>
  <div class="r-dashboard-deposits region chrome" data-region="dashboard-deposits"><!-- lista de señas pendientes con montos, vencimiento y acción --></div>
  <div class="r-dashboard-today region chrome" data-region="dashboard-today"><!-- agenda de hoy en filas densas con horas y estados --></div>
  <div class="r-dashboard-quick-actions region chrome" data-region="dashboard-quick-actions"><!-- columna de acciones frecuentes con iconos lineales --></div>
  <div class="r-dashboard-drawer region chrome" data-region="dashboard-drawer"><!-- panel lateral Nuevo turno con campos compactos y acciones inferiores --></div>
</main>
</body>
</html>
